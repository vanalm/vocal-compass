# Temporary audit workbench. Read-only, no environments, credentials or deployment.
name: Audit workbench
on:
  push:
    branches: [audit/science-progress-2026-09-28]
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Package public source and installed frontend dependencies
        run: |
          git rev-parse HEAD > audit-source-sha.txt
          tar --exclude=.git --exclude=audit-workbench.tgz -czf /tmp/audit-workbench.tgz .
          mv /tmp/audit-workbench.tgz audit-workbench.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-workbench
          path: audit-workbench.tgz
          retention-days: 1
          if-no-files-found: error
