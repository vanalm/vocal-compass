# The production image against real Postgres, on a laptop:
#
#   docker compose up --build        then open http://localhost:8090
#
# Dev auth signs everyone in as dev@localhost, so the app listens on loopback only.
# `docker compose down -v` also deletes the database.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vocal
      POSTGRES_PASSWORD: vocal
      POSTGRES_DB: vocal
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: on first start the image initialises through a socket-only server, which
      # pg_isready's default socket check would call ready while the app still cannot connect.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=vocal", "--dbname=vocal"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      ENVIRONMENT: development
      AUTH_MODE: dev
      APP_BASE_URL: http://localhost:8090
      DATABASE_URL: postgresql+psycopg://vocal:vocal@db:5432/vocal
      RUN_MIGRATIONS_ON_START: "1"
      LOG_FORMAT: json
    ports:
      # 8090, not 8080, which other local stacks use.
      - "127.0.0.1:8090:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
